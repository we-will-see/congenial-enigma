name: enigma

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: indiair
      POSTGRES_USER: indiair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indiair -d indiair"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: enigma-api:local
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://indiair:${POSTGRES_PASSWORD}@postgres:5432/indiair
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/data/documents}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      APP_WORKERS: ${APP_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      USE_AWS_TEXTRACT: ${USE_AWS_TEXTRACT:-false}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - document_data:/app/data/documents
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
  document_data:
